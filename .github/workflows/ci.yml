name: Client and Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an older run when a new run starts for the same Git ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate the client and server independently so both jobs can run in parallel.
  client:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Use the shared Node.js version and cache npm downloads for the client.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # or node-version: 26
          cache: npm
          cache-dependency-path: web/client/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint client
        run: npm run lint
      - name: Test client
        run: npm test
      - name: Build client
        run: npm run build

  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Use the shared Node.js version and cache npm downloads for the server.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/server/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint server
        run: npm run lint
      - name: Test server
        run: npm test
      - name: Build server
        run: npm run build
