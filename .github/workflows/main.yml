# this is my first workflow

name: CI

# controls when the workflow will run
on:
  # Trigger the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run in made up for one or more jobs that can run sequentially or in parallel
jobs:
  # this workflow contains a single jobs called "build"
  build:
    # the type of runner that job will run on
    runs-on: ubuntu-latest

    # steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your hib can access it
      - uses: actions/checkout@v7

      # Run a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Run a set of commands using the runners shell
      - name: Runs a multi-line script
        run: |
          echo Add other action to build,
          echo test and deploy your project.
  
